<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>View in AR</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #f2f2f2;
        font-family: Arial, sans-serif;
      }

      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        text-align: center;
      }

      .thumb {
        width: 320px;
        max-width: 80vw;
        border-radius: 14px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      }

      .label {
        margin-top: 14px;
        font-size: 20px;
        color: #111;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <a rel="ar" href="model.usdz">
          <img class="thumb" src="preview.jpg" alt="View model in AR">
        </a>
        <div class="label">Tap image to view in AR</div>
      </div>
    </div>
  </body>
</html>
