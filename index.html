<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR Viewer</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        font-family: Arial, sans-serif;
        background: #f2f2f2;
      }

      .wrap {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      a {
        display: inline-block;
        padding: 18px 28px;
        font-size: 20px;
        text-decoration: none;
        color: white;
        background: #111;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a rel="ar" href="model.usdz">
        View in AR
      </a>
    </div>
  </body>
</html>
