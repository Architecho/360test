<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body style="margin:0;">
    <a-scene>
      <a-assets timeout="30000">
        <a-asset-item id="mymodel" src="25073 model 2026 03-10 3dwarehouse.glb"></a-asset-item>
      </a-assets>

      <a-sky color="#ECECEC"></a-sky>

      <a-entity
        gltf-model="#mymodel"
        position="0 0 -5"
        rotation="0 45 0"
        scale="3 3 3">
      </a-entity>

      <a-camera position="0 1.6 0" look-controls="touchEnabled: true"></a-camera>
    </a-scene>
  </body>
</html>
