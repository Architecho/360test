<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body style="margin:0;">
    <a-scene>
      <a-assets>
        <a-asset-item id="mymodel" src="model.glb"></a-asset-item>
      </a-assets>

      <a-sky color="#ECECEC"></a-sky>

      <a-entity
        gltf-model="#mymodel"
        position="0 0 -3"
        rotation="0 45 0"
        scale="1 1 1">
      </a-entity>

      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
  </body>
</html>
